name: Build, check and deploy

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the build; the deploy job asks for what Pages needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/configure-pages@v6

      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # External links are not checked: a 13-year archive points at plenty of
      # sites that rate-limit or have since moved, and a red build caused by
      # someone else's outage teaches you to ignore the build.
      - name: Check HTML
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --allow-hash-href \
            --no-enforce-https

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  # Only main deploys. A pull request gets the build and the checks, nothing more.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
